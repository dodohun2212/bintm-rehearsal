name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: python -m pip install -r requirements.txt
      - name: 테스트 (가짜 AI, 키 없음)
        env:
          BINTM_FAKE_AI: "1"
        run: python -m pytest -q tests/
